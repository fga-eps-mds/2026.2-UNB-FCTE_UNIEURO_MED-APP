name: Export de métricas

# Requisito do professor (Discord da disciplina, 14/09): a cada PR fechado com
# merge, o pipeline do repositório de código gera a release, coleta as métricas
# do SonarCloud e anexa o .json à release. A coleta diária do repositório de
# documentação copia esse arquivo para analytics-raw-data/, sem exigir secret
# de escrita entre repositórios. Segue o exemplo indicado por ele (2024.2-SENTINELA).
#
# Gatilhos (#45, avaliação da R1): na `main`, a release estável sai do push, então
# todo commit que chega à `main` gera release, com o APK anexado. Na `develop`, a
# pré-release continua saindo do PR fechado com merge. Como o PR para a `main` não
# dispara mais pelo fechamento, só pelo push que o merge faz, não há release
# duplicada.
#
# Rótulos do PR que controlam a versão:
#   MAJOR RELEASE  vX.0.0 — release principal (R1, R2, R3); anexa também o código-fonte
#   MINOR RELEASE  vX.Y.0
#   (nenhum)       vX.Y.Z — correção
#   NOT RELEASE    não gera release

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop]
    types: [closed]
  # Disparo manual do job `apk`, sem passar pela release. Dois usos, nunca os dois
  # juntos:
  #   tag     gera o APK de uma release já publicada e o anexa a ela;
  #   versao  gera um APK de TESTE da branch escolhida e o guarda como artefato do
  #           workflow (7 dias), sem criar nem alterar release. Serve para conferir a
  #           assinatura e a versão antes da release e para testar a atualização por
  #           cima no tablet (#104). Não é APK de entrega.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de uma release já publicada que vai receber o APK (ex.: v1.2.0). Deixe em branco para gerar um APK de teste"
        required: false
      versao:
        description: "Só para o APK de teste: versão MAJOR.MINOR.PATCH da branch escolhida (ex.: 2.0.3). Use uma que o tablet aceite, maior que a instalada"
        required: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      gerar: ${{ steps.pr.outputs.gerar }}

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.merge_commit_sha }}
      MERGED_AT: ${{ github.event_name == 'push' && github.event.head_commit.timestamp || github.event.pull_request.merged_at }}
      BASE: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.base.ref }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      # No push o evento não traz o PR: o script procura o PR do commit de merge
      # para ler os rótulos de versão. No fechamento do PR, eles vêm do evento.
      - name: Identificar o PR do merge
        id: pr
        env:
          EVENTO: ${{ github.event_name }}
          NUMERO_PR: ${{ github.event.pull_request.number }}
          TITULO_PR: ${{ github.event.pull_request.title }}
          MAJOR_PR: ${{ contains(github.event.pull_request.labels.*.name, 'MAJOR RELEASE') }}
          MINOR_PR: ${{ contains(github.event.pull_request.labels.*.name, 'MINOR RELEASE') }}
          SEM_RELEASE: ${{ contains(github.event.pull_request.labels.*.name, 'NOT RELEASE') }}
        run: |
          set -euo pipefail
          if [ "$EVENTO" = "push" ]; then
            python3 metrics/sonar_metrics.py pr-do-commit "$SHA" >> "$GITHUB_OUTPUT"
          else
            gerar=true
            [ "$SEM_RELEASE" = "true" ] && gerar=false
            {
              echo "numero=$NUMERO_PR"
              echo "titulo=$TITULO_PR"
              echo "major=$MAJOR_PR"
              echo "minor=$MINOR_PR"
              echo "gerar=$gerar"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Definir versão
        id: versao
        if: steps.pr.outputs.gerar == 'true'
        env:
          MAJOR: ${{ steps.pr.outputs.major }}
          MINOR: ${{ steps.pr.outputs.minor }}
        run: python3 metrics/sonar_metrics.py versao >> "$GITHUB_OUTPUT"

      - name: Aguardar a análise do SonarCloud
        if: steps.pr.outputs.gerar == 'true'
        run: python3 metrics/sonar_metrics.py aguardar "$MERGED_AT"

      - name: Coletar métricas do SonarCloud
        id: metricas
        if: steps.pr.outputs.gerar == 'true'
        run: python3 metrics/sonar_metrics.py coletar "${{ steps.versao.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        if: steps.pr.outputs.gerar == 'true'
        env:
          TAG: ${{ steps.versao.outputs.tag }}
          ARQUIVO: ${{ steps.metricas.outputs.arquivo }}
          TITULO: ${{ steps.pr.outputs.titulo }}
          NUMERO: ${{ steps.pr.outputs.numero }}
          MAJOR: ${{ steps.pr.outputs.major }}
        run: |
          set -euo pipefail
          assets=("$ARQUIVO")

          # Releases principais levam também o código-fonte e os testes compactados.
          if [ "$MAJOR" = "true" ]; then
            pacote="${GITHUB_REPOSITORY#*/}-${TAG}.zip"
            git archive --format=zip -o "$pacote" "$SHA"
            assets+=("$pacote")
          fi

          # O que entra na develop é versão intermediária; só a main publica release estável.
          previa=()
          [ "$BASE" = "develop" ] && previa=(--prerelease)

          if [ -n "$NUMERO" ]; then
            notas="Gerada pelo merge do PR #${NUMERO} (${TITULO}) na ${BASE}."
          else
            notas="Gerada pelo push do commit ${SHA:0:7} na ${BASE}."
          fi
          gh release create "$TAG" "${assets[@]}" --target "$SHA" --title "$TAG" \
            --notes "$notas" "${previa[@]}"

  # APK da release estável (#45): gerado aqui, com o perfil de entrega, para o PO
  # baixar direto da release, sem depender da conta do Expo. O perfil `preview`
  # aplica o app.config.js, que tira a internet e as permissões sem uso (#63).
  # O APK leva a versão da tag (v2.1.3 vira versionName 2.1.3 e versionCode 20103)
  # e é assinado com a chave do MED, guardada nos segredos do repositório (#104).
  # Os APKs até a v2.0.2 saíram com a chave de debug do modelo do Expo, então o
  # primeiro APK com a chave do MED exige desinstalar o aplicativo uma vez. Depois
  # dele, cada versão instala por cima da anterior sem perder dados. Num disparo
  # manual para uma tag antiga, o job falha de propósito, porque aquele código não
  # tem a assinatura do MED.
  apk:
    name: APK da release
    needs: release
    # No disparo manual o job `release` não roda, por isso o `!cancelled()`.
    if: >-
      !cancelled() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.release.outputs.gerar == 'true'))
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release.outputs.tag }}
      VERSAO_TESTE: ${{ github.event_name == 'workflow_dispatch' && inputs.versao || '' }}

    defaults:
      run:
        working-directory: aplicativo/projeto-unieuro

    steps:
      # O APK sai do mesmo código da release: no disparo manual, o da tag informada
      # ou, no APK de teste, o da branch em que o workflow foi disparado.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.TAG || github.sha }}

      - name: Configurar o Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: aplicativo/projeto-unieuro/package-lock.json

      - name: Configurar o Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      # O nome da versão sai da tag (ou da versão informada no APK de teste); o
      # app.config.js calcula o código da versão.
      - name: Definir a versão do APK
        run: |
          set -euo pipefail
          if [ -n "$TAG" ] && [ -n "$VERSAO_TESTE" ]; then
            echo "::error::Informe a tag de uma release ou a versão do APK de teste, não as duas."
            exit 1
          fi
          versao="${TAG#v}"
          [ -z "$TAG" ] && versao="$VERSAO_TESTE"
          if [ -z "$versao" ]; then
            echo "::error::Informe a tag de uma release ou a versão do APK de teste."
            exit 1
          fi
          echo "APP_VERSION=$versao" >> "$GITHUB_ENV"

      - name: Gerar o projeto Android no perfil de entrega
        env:
          EAS_BUILD_PROFILE: preview
          CI: 1
        run: npx expo prebuild --platform android --no-install

      # A chave nunca vai para o repositório: vem dos segredos, em base64, e só
      # existe no disco do executor durante o build.
      - name: Preparar a chave de assinatura
        env:
          MED_KEYSTORE_BASE64: ${{ secrets.MED_KEYSTORE_BASE64 }}
          MED_KEYSTORE_PASSWORD: ${{ secrets.MED_KEYSTORE_PASSWORD }}
          MED_KEY_ALIAS: ${{ secrets.MED_KEY_ALIAS }}
          MED_KEY_PASSWORD: ${{ secrets.MED_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for segredo in MED_KEYSTORE_BASE64 MED_KEYSTORE_PASSWORD MED_KEY_ALIAS MED_KEY_PASSWORD; do
            if [ -z "${!segredo}" ]; then
              echo "::error::O segredo $segredo não está configurado no repositório."
              exit 1
            fi
          done
          chave="$RUNNER_TEMP/med-release.jks"
          echo "$MED_KEYSTORE_BASE64" | base64 --decode > "$chave"
          echo "MED_KEYSTORE_PATH=$chave" >> "$GITHUB_ENV"

      - name: Compilar o APK
        working-directory: aplicativo/projeto-unieuro/android
        env:
          MED_KEYSTORE_PASSWORD: ${{ secrets.MED_KEYSTORE_PASSWORD }}
          MED_KEY_ALIAS: ${{ secrets.MED_KEY_ALIAS }}
          MED_KEY_PASSWORD: ${{ secrets.MED_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      # Garante a regra do CLAUDE.md: o APK de entrega não pode pedir internet.
      - name: Conferir as permissões do APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          aapt2="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/aapt2"
          "$aapt2" dump badging "$apk" | grep -E "^(package|uses-permission)" | tee permissoes.txt
          if grep -q "android.permission.INTERNET" permissoes.txt; then
            echo "::error::O APK de entrega declara a permissão de internet."
            exit 1
          fi

      # Garante a #104: o APK de entrega não pode sair com a chave de debug, e a
      # versão e o código da versão precisam ser os da tag.
      - name: Conferir a assinatura e a versão do APK
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          ferramentas="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"

          "$ferramentas/apksigner" verify --print-certs "$apk" | tee assinatura.txt
          if grep -q "CN=Android Debug" assinatura.txt; then
            echo "::error::O APK de entrega está assinado com a chave de debug."
            exit 1
          fi

          IFS=. read -r maior menor correcao <<< "$APP_VERSION"
          codigo=$(( 10#$maior * 10000 + 10#$menor * 100 + 10#$correcao ))
          "$ferramentas/aapt2" dump badging "$apk" | grep -E "^package" | tee versao.txt
          if ! grep -q "versionName='$APP_VERSION'" versao.txt || ! grep -q "versionCode='$codigo'" versao.txt; then
            echo "::error::O APK não tem a versão $APP_VERSION (código $codigo)."
            exit 1
          fi

          # A impressão digital do certificado prova que dois APKs saíram da mesma
          # chave, condição para um instalar por cima do outro.
          {
            echo "### APK ${APP_VERSION} (código ${codigo})"
            echo
            echo '```'
            grep -E "Signer #1 certificate (DN|SHA-256 digest)" assinatura.txt
            echo '```'
            [ -z "$TAG" ] && echo "APK de **teste** da branch \`${GITHUB_REF_NAME}\`: não é de entrega."
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Anexar o APK à release
        if: env.TAG != ''
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk "MED-${TAG}.apk"
          gh release upload "$TAG" "MED-${TAG}.apk" --clobber

      # APK de teste: fica só como artefato do workflow, para baixar e instalar no
      # tablet. A versão no nome evita confundi-lo com o APK de uma release.
      - name: Guardar o APK de teste como artefato
        if: env.TAG == ''
        run: cp android/app/build/outputs/apk/release/app-release.apk "MED-teste-${APP_VERSION}.apk"

      - name: Publicar o artefato do APK de teste
        if: env.TAG == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MED-teste-${{ env.APP_VERSION }}
          path: aplicativo/projeto-unieuro/MED-teste-${{ env.APP_VERSION }}.apk
          retention-days: 7
          if-no-files-found: error

      - name: Apagar a chave de assinatura do executor
        if: always()
        run: rm -f "${RUNNER_TEMP}/med-release.jks"
