sonar.projectKey=fga-eps-mds_2026.2-UNB-FCTE_UNIEURO_MED-APP
sonar.organization=fga-eps-mds-1

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=2026.2-UNB-FCTE_UNIEURO_MED-APP
#sonar.projectVersion=1.0

sonar.sourceEncoding=UTF-8

# Os caminhos abaixo são relativos a esta pasta, que o workflow informa como
# `projectBaseDir`. É o que faz Sonar, Jest e relatório de cobertura usarem a
# mesma raiz: o lcov gera caminhos como `src/constants/theme.ts`, que só casam
# com os arquivos se a base da análise for o projeto Expo, e não a raiz do
# repositório. Com a base na raiz, a cobertura chegaria zerada.
sonar.sources=src
sonar.tests=src

# Código e teste moram na mesma pasta, por convenção do projeto. O padrão
# abaixo separa os dois: o que casa aqui é indexado como teste.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Relatório gerado por `npm run test:coverage`.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fora da análise: dependências, saída de cobertura e recursos visuais.
sonar.exclusions=node_modules/**,coverage/**,assets/**

# Fora da cobertura: as rotas só reexportam as telas e as variantes web não são
# embarcadas no APK. Os mesmos caminhos estão excluídos no `jest.config.js`.
sonar.coverage.exclusions=src/app/**,src/**/*.web.ts,src/**/*.web.tsx
